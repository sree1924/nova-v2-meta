<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utah Driver Handbook — Section 9 Rules of the Road</title>
<link rel="stylesheet" href="styles.css">
<script src="data-embedded.js" defer></script>
<script src="data-real-embedded.js" defer></script>
</head>
<body>
<div class="real-banner" id="banner" role="note">REAL — Utah Section 9, belt-validated, audit pending</div>
<header class="site">
  <div class="wrap">
    <span class="brand">Utah Section 9 — Rules of the Road</span>
    <nav class="main" aria-label="Learner">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/chapters" data-nav="chapters">Modules</a>
      <a href="#/practice" data-nav="practice">Practice tests</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="site">dev preview — no production claims · text-first pilot, no audio</footer>
<script type="module">
const SYNTHETIC_NOTE = "SYNTHETIC SAMPLE — not Utah content.";
const REAL_NOTE = "REAL — Utah Section 9, belt-validated, audit pending";
const REVIEWER_EMPTY_NOTE = "REVIEWER VIEW — no accepted Utah content yet";

function setBanner(kind, text) {
  const b = document.getElementById("banner");
  b.className = kind === "real" ? "real-banner" : kind === "review" ? "review-banner" : "sample-banner";
  b.textContent = text;
}

let R = null;
async function loadReal() {
  try {
    const manifest = await (await fetch("data/real/manifest.json", {cache: "no-store"})).json();
    const files = {};
    for (const e of manifest.files || []) {
      files[e.file.replace(/^data\/real\//, "")] = await (await fetch(e.file, {cache: "no-store"})).json();
    }
    return { manifest, files, from: "fetch" };
  } catch (e) {
    const emb = window.__REAL_EMBEDDED;
    if (emb) return { manifest: emb.manifest, files: emb.files, from: "embedded-fallback" };
    return { manifest: null, files: {}, from: "none" };
  }
}
const view = document.getElementById("view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- Synthetic sample (comparison only, under #/synthetic-sample) ----
async function loadData() {
  try {
    const get = async (p) => (await fetch(p, {cache: "no-store"})).json();
    const manifest = await get("data/manifest.json");
    const ch = manifest.chapters[0];
    const [cards, teaching, exam] = await Promise.all([
      get("data/" + ch.cards), get("data/" + ch.units[0].teaching), get("data/" + ch.exam)
    ]);
    return { manifest, cards, teaching, exam, from: "fetch" };
  } catch (e) {
    const emb = window.__PREVIEW_EMBEDDED;
    if (!emb) {
      view.innerHTML = "<h1>Could not load sample data</h1><p>No data files found and no embedded fallback. Serve this folder over HTTP or keep data-embedded.js next to index.html.</p>";
      throw e;
    }
    return { ...emb, from: "embedded-fallback" };
  }
}

// ---- Learner progress (real syllabus namespace) ----
const store = {
  key: "nova-preview:v1:ut-sec09",
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  write(s) { localStorage.setItem(this.key, JSON.stringify(s)); }
};
const saveResult = (rec) => { const s = store.read(); s.results = s.results || {}; s.results[rec.attemptId] = rec; store.write(s); };
const getResult = (id) => (store.read().results || {})[id] || null;
const markDone = (unitId, what) => { const s = store.read(); s.progress = s.progress || {}; s.progress[unitId] = s.progress[unitId] || {}; s.progress[unitId][what] = true; store.write(s); };

let D = null;

// ---- Real-data accessors (accepted belt artifacts only) ----
function realEntries() {
  const list = (R && R.manifest && R.manifest.files) || [];
  return {
    dossier: list.filter((e) => e.stage_id === "02.dossier_sections"),
    kg: list.filter((e) => e.stage_id === "03.combined_kg"),
    cards: list.filter((e) => e.stage_id === "04.cards"),
    exam: list.filter((e) => e.stage_id === "06.exam_bank"),
    sessions: list.filter((e) => e.stage_id === "05.sessions"),
    scripts: list.filter((e) => e.stage_id === "05.card_scripts"),
    other: list.filter((e) => e.stage_id !== "02.dossier_sections" && e.stage_id !== "03.combined_kg" && e.stage_id !== "04.cards" && e.stage_id !== "06.exam_bank" && e.stage_id !== "05.sessions" && e.stage_id !== "05.card_scripts")
  };
}
function realArt(entry) {
  if (!entry) return null;
  return (R.files || {})[entry.file.replace(/^data\/real\//, "")] || null;
}
function kgDoc() {
  const { kg } = realEntries();
  return kg.length ? realArt(kg[0]) : null;
}
function modulesReal() {
  const kg = kgDoc();
  if (!kg) return [];
  const hints = Array.isArray(kg.curriculum_unit_hints) ? kg.curriculum_unit_hints : [];
  const hintByModule = {};
  hints.forEach((h) => { hintByModule[h.module_id] = h; });
  return (Array.isArray(kg.modules) ? kg.modules : []).map((m) => ({
    module_id: m.module_id,
    title: m.title,
    domain: m.domain,
    nodeCount: (m.node_ids || []).length,
    unit_id: (hintByModule[m.module_id] || {}).unit_id || null
  }));
}
function unitForModule(moduleId) {
  const m = modulesReal().find((x) => x.module_id === moduleId);
  return m ? m.unit_id : null;
}
function moduleForUnit(unitId) {
  const m = modulesReal().find((x) => x.unit_id === unitId);
  return m ? m.module_id : null;
}
function sessionUnit(unitId) {
  const { sessions } = realEntries();
  for (const e of sessions) {
    const art = realArt(e);
    const u = ((art && art.units) || []).find((x) => x.unit_id === unitId);
    if (u) return u;
  }
  return null;
}
function deckForUnit(unitId) {
  const moduleId = moduleForUnit(unitId);
  const { cards } = realEntries();
  const out = [];
  for (const e of cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) {
      for (const c of (d.cards || [])) {
        if (c.unit_id === unitId || (moduleId && c.module_id === moduleId)) out.push(c);
      }
    }
  }
  const seen = new Set();
  return out.filter((c) => (seen.has(c.card_id) ? false : (seen.add(c.card_id), true)));
}
function scriptsByCard() {
  const { scripts } = realEntries();
  const byCard = {};
  for (const e of scripts) {
    const art = realArt(e);
    for (const s of ((art && art.audio_scripts) || [])) {
      if (!s.is_recap) byCard[s.card_id] = s;
    }
  }
  return byCard;
}
function recapForModule(moduleId) {
  const { scripts } = realEntries();
  for (const e of scripts) {
    const art = realArt(e);
    const r = ((art && art.audio_scripts) || []).find((s) => s.is_recap && s.module_id === moduleId);
    if (r) return r;
  }
  return null;
}
function examDoc() {
  const { exam } = realEntries();
  return exam.length ? realArt(exam[0]) : null;
}
function examItemsById() {
  const doc = examDoc();
  const byId = {};
  for (const it of ((doc && doc.items) || [])) byId[it.item_id] = it;
  return byId;
}
function moduleQuizForUnit(unitId) {
  const doc = examDoc();
  return ((doc && doc.module_quizzes) || []).find((q) => q.unit_id === unitId) || null;
}
function practiceForms() {
  const doc = examDoc();
  return ((doc && doc.practice_forms) || []);
}
// fact id -> handbook page, from accepted card + item source refs
function factPageMap() {
  const map = {};
  for (const c of (examDoc() && examDoc().items) || []) {
    for (const f of (c.fact_ids || [])) {
      if (!map[f] && c.source_ref) map[f] = c.source_ref;
    }
  }
  const { cards } = realEntries();
  for (const e of cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) {
      for (const c of (d.cards || [])) {
        for (const f of (c.claims_fact_ids || [])) {
          if (!map[f] && c.source_ref) map[f] = c.source_ref;
        }
      }
    }
  }
  return map;
}
let _factPages = null;
function sourceLine(factIds) {
  if (!_factPages) _factPages = factPageMap();
  const ids = (factIds || []).filter(Boolean);
  if (!ids.length) return `<p class="muted">Source: <a href="#/dossier">Utah Driver Handbook Sec 9</a></p>`;
  const pages = ids.map((f) => {
    const ref = _factPages[f];
    const pg = ref && (ref.printed_page || ref.pdf_page) ? `, p. ${esc(ref.printed_page || ("PDF " + ref.pdf_page))}` : "";
    return `<a href="#/dossier">${esc(f)}</a>${pg}`;
  }).join(" · ");
  return `<p class="muted">Source: ${pages} · Utah Driver Handbook Sec 9</p>`;
}
