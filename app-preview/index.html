    <nav class="main" aria-label="Learner">
      <a href="#/" data-nav="states">All states</a>
      <a href="#/ut/" data-nav="home">Home</a>
      <a href="#/ut/chapters" data-nav="chapters">Chapters</a>

    </nav>

<main class="wrap" id="view" tabindex="-1"></main>
<footer class="site">dev preview — no production claims · narration: pre-generated files only (OpenAI TTS, not a Meta model)</footer>
<script type="module">
const SYNTHETIC_NOTE = "SYNTHETIC SAMPLE — not Utah content.";
const PICKER_NOTE = "REAL — driver handbook courses, belt-validated, audit pending";

// ---- Multi-state shell ----
// The state registry lives in data/states.json (file:// fallback:
// states-embedded.js). Every state-specific path resolves through its entry:
// data_root (content manifest + accepted exports), audio_root (clips),
// audio_manifest, and the optional content_embedded / audio_embedded
// fallbacks. A new state = one entry + its export folders; no code changes.
// Routes: #/ = state picker; #/<xx>/… = that state's course (xx = lowercase code).
// Legacy unprefixed routes (#/chapter/…, #/lesson/…, …) redirect to Utah for
// one release so nothing already linked breaks.
const LEGACY_STATE = "ut";
const LEGACY_ROUTES = new Set(["chapters", "chapter", "module", "lesson", "cards", "quiz", "practice", "results", "settings", "dossier", "modules", "real-cards", "real-quiz", "real-lesson"]);
let STATES = null;          // registry array once loaded
let STATES_FROM = "none";
let ST = null;              // active state entry
const STATE_CACHE = {};     // code -> { R, audio: { manifest, from } }
const SUMMARY = {};         // code -> picker counts from its manifests
const pendingState = {}, pendingSummary = {};
const slugOf = (s) => String(s.code || "").toLowerCase();
const stateBySlug = (slug) => (STATES || []).find((s) => slugOf(s) === String(slug || "").toLowerCase()) || null;
const P = () => "#/" + (ST ? slugOf(ST) : LEGACY_STATE) + "/";
const HB = () => (ST ? (ST.short_title || `${ST.name} Driver Handbook`) : "Driver Handbook");
const trimSlash = (p) => String(p || "").replace(/\/+$/, "");
const contentEmbeddedSrc = (s) => s.content_embedded || (trimSlash(s.data_root) + "-embedded.js");
const audioEmbeddedSrc = (s) => s.audio_embedded || String(s.audio_manifest || "").replace(/\.json$/, "-embedded.js");
// Manifest file path -> key relative to the state's data_root.
function relKey(dataRoot, file) {
  const pre = trimSlash(dataRoot) + "/";
  const f = String(file || "");
  return f.startsWith(pre) ? f.slice(pre.length) : f.replace(/^data\/real\//, "");
}
async function fetchJson(p) {
  const r = await fetch(p, {cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status + " " + p);
  return r.json();
}
// file:// fallback: inject one generated *-embedded.js and capture its global.
// Loads are serialized because several states' fallbacks share a global name.
function loadScript(src) {
  return new Promise((resolve) => {
    try {
      const el = document.createElement("script");
      el.onload = () => resolve(true);
      el.onerror = () => resolve(false);
      el.src = src;
      (document.head || document.body).appendChild(el);
    } catch { resolve(false); }
  });
}
let embedChain = Promise.resolve();
function loadEmbedded(src, globalName) {
  const run = async () => {
    if (!src) return null;
    try { window[globalName] = undefined; } catch { /* no-op */ }
    const ok = await loadScript(src);
    const v = ok ? window[globalName] : null;
    try { window[globalName] = undefined; } catch { /* no-op */ }
    return v || null;
  };
  const p = embedChain.then(run, run);
  embedChain = p.catch(() => null);
  return p;
}
async function loadStates() {
  try {
    const list = await fetchJson("data/states.json");
    if (Array.isArray(list)) return { list, from: "fetch" };
  } catch { /* fall through to the embedded copy */ }
  const emb = window.__STATES_EMBEDDED;
  if (Array.isArray(emb)) return { list: emb, from: "embedded-fallback" };
  return { list: [], from: "none" };
}

// Handbook chapters in handbook order come from the state's entry
// (chapters: [{id, n, title}]); without one, the accepted KG sections are
// listed in slug order with humanized titles. Only chapters with accepted
// belt artifacts are built.
let SECTIONS = [];
let REAL_NOTE = PICKER_NOTE;
let REVIEWER_EMPTY_NOTE = "REVIEWER VIEW — no accepted content yet";
const sectionMeta = (id) => SECTIONS.find((s) => s.id === id) || null;
const shortSection = (id) => { const m = sectionMeta(id); return m ? `Chapter ${m.n} — ${m.title}` : HB(); };
const humanize = (slug) => String(slug || "").replace(/^sec\d+-?/, "").split("-").filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(" ") || String(slug || "");
function sectionsFor(s, r) {
  if (Array.isArray(s.chapters) && s.chapters.length) return s.chapters.map((c, i) => ({ id: c.id, n: c.n || i + 1, title: c.title || humanize(c.id) }));
  const ids = [...new Set(((r && r.manifest && r.manifest.files) || []).filter((e) => e.stage_id === "03.combined_kg").map((e) => e.section_id))].sort();
  return ids.map((id, i) => ({ id, n: i + 1, title: humanize(id) }));
}

function setBanner(kind, text) {
  const b = document.getElementById("banner");
  b.className = kind === "real" ? "real-banner" : kind === "review" ? "review-banner" : "sample-banner";
  b.textContent = text;
}

let R = null;
async function loadReal(s) {
  const root = trimSlash(s.data_root);
  try {
    const manifest = await fetchJson(root + "/manifest.json");
    if (manifest.run_id && manifest.run_id !== s.run_id) return { manifest: null, files: {}, from: "run-mismatch" };
    const files = {};
    for (const e of manifest.files || []) {
      const rel = relKey(root, e.file);
      files[rel] = await fetchJson(root + "/" + rel);
    }
    return { manifest, files, from: "fetch" };
  } catch (e) {
    const emb = await loadEmbedded(contentEmbeddedSrc(s), "__REAL_EMBEDDED");
    if (emb && emb.manifest && (!emb.manifest.run_id || emb.manifest.run_id === s.run_id)) return { manifest: emb.manifest, files: emb.files || {}, from: "embedded-fallback" };
    return { manifest: null, files: {}, from: "none" };
  }
}
function ensureState(s) {
  if (STATE_CACHE[s.code]) return Promise.resolve(STATE_CACHE[s.code]);
  if (!pendingState[s.code]) {
    pendingState[s.code] = Promise.all([loadReal(s), loadAudio(s)])
      .then(([r, a]) => (STATE_CACHE[s.code] = { R: r, audio: a }));
  }
  return pendingState[s.code];
}
// Picker counts straight from a state's manifests (content + audio).
function summarize(s, manifest, audio) {
  if (!manifest) return { ok: false };
  const files = manifest.files || [];
  const kgSecs = new Set(files.filter((e) => e.stage_id === "03.combined_kg").map((e) => e.section_id));
  const t = (audio && audio.totals) || null;
  return { ok: true, files: files.length, chaptersBuilt: kgSecs.size, chaptersTotal: (s.chapters || []).length || kgSecs.size,
    audio: t ? { clips: t.clips, cards: t.cards, slides: t.slides, recaps: t.recaps } : null };
}
function ensureSummary(s) {
  if (SUMMARY[s.code]) return Promise.resolve(SUMMARY[s.code]);
  if (!pendingSummary[s.code]) {
    pendingSummary[s.code] = (async () => {
      let manifest = null, audio = null;
      try { manifest = await fetchJson(trimSlash(s.data_root) + "/manifest.json"); } catch { /* fallback below */ }
      if (manifest && manifest.run_id && manifest.run_id !== s.run_id) manifest = null;
      try { audio = await fetchJson(s.audio_manifest); } catch { /* fallback below */ }
      if (!manifest) { // file:// (or no export over HTTP): the full fallback load also yields the audio manifest
        const c = await ensureState(s);
        manifest = manifest || c.R.manifest;
        audio = audio || c.audio.manifest;
      }
      return (SUMMARY[s.code] = summarize(s, manifest, audio));
    })();
  }
  return pendingSummary[s.code];
}
function activateState(s) {
  if (ST === s) return;
  const c = STATE_CACHE[s.code];
  ST = s;
  R = c.R;
  AUDIO_MANIFEST = c.audio.manifest;
  AUDIO_FROM = c.audio.from;
  SECTIONS = sectionsFor(s, R);
  REAL_NOTE = `REAL — ${HB()}, belt-validated, audit pending`;
  REVIEWER_EMPTY_NOTE = `REVIEWER VIEW — no accepted ${s.name} content yet`;
  _factPages = null;
  buildAudioIndex();
}
const view = document.getElementById("view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- Synthetic sample (comparison only, under #/synthetic-sample) ----
async function loadData() {
  try {
    const get = async (p) => (await fetch(p, {cache: "no-store"})).json();
    const manifest = await get("data/manifest.json");
    const ch = manifest.chapters[0];
    const [cards, teaching, exam] = await Promise.all([
      get("data/" + ch.cards), get("data/" + ch.units[0].teaching), get("data/" + ch.exam)
    ]);
    return { manifest, cards, teaching, exam, from: "fetch" };
  } catch (e) {
    const emb = window.__PREVIEW_EMBEDDED;
    if (!emb) {
      view.innerHTML = "<h1>Could not load sample data</h1><p>No data files found and no embedded fallback. Serve this folder over HTTP or keep data-embedded.js next to index.html.</p>";
      throw e;
    }
    return { ...emb, from: "embedded-fallback" };
  }
}

// ---- Learner progress (real syllabus namespace) ----
// Namespaced per state: nova-preview:v1:<xx>-handbook (Utah keeps its key).
const store = {
  get key() { return `nova-preview:v1:${ST ? slugOf(ST) : LEGACY_STATE}-handbook`; },
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  write(s) { localStorage.setItem(this.key, JSON.stringify(s)); }
};
const saveResult = (rec) => { const s = store.read(); s.results = s.results || {}; s.results[rec.attemptId] = rec; store.write(s); };
const getResult = (id) => (store.read().results || {})[id] || null;
const markDone = (unitId, what) => { const s = store.read(); s.progress = s.progress || {}; s.progress[unitId] = s.progress[unitId] || {}; s.progress[unitId][what] = true; store.write(s); };

// ---- Pre-generated narration (minted clips, files only) ----
// Clips were minted by the Nova fleet recipe (OpenAI gpt-4o-mini-tts, voice
// "nova" — NOT a Meta model) and listed in the state's audio manifest
// (Utah: audio/audio-manifest.json). The app only ever plays a file_ref from
// that manifest; nothing is synthesized here.
const AUDIO_LABEL = "narration · pre-generated (OpenAI TTS, not a Meta model)";
let AUDIO_MANIFEST = null;
let AUDIO_FROM = "none";
let AUDIO_ROOT = "audio";
async function loadAudio(s) {
  try {
    const m = await fetchJson(s.audio_manifest);
    return { manifest: m, from: "fetch" };
  } catch (e) {
    const emb = await loadEmbedded(audioEmbeddedSrc(s), "__AUDIO_MANIFEST_EMBEDDED");
    if (emb) return { manifest: emb, from: "embedded-fallback" };
    return { manifest: null, from: "none" };
  }
}
// Manifest file_refs follow the fleet minter's "audio/<file>" convention;
// they are rebased under the state's audio_root (identity for Utah, whose
// audio_root is "audio").
function rebaseAudio(ref) {
  const r = String(ref || "");
  if (r.startsWith(AUDIO_ROOT + "/")) return r;
  if (r.startsWith("audio/")) return AUDIO_ROOT + r.slice("audio".length);
  return AUDIO_ROOT + "/" + r;
}
let AUDIO_FILES = new Set();
let AUDIO_THINK = {};
let AUDIO_PAUSE_MS = 3000;
function buildAudioIndex() {
  AUDIO_FILES = new Set();
  AUDIO_THINK = {};
  AUDIO_PAUSE_MS = 3000;
  AUDIO_ROOT = trimSlash((ST && ST.audio_root) || "audio") || "audio";
  const m = AUDIO_MANIFEST;
  if (!m) return;
  for (const e of (m.entries || [])) {
    if (e.file_ref) AUDIO_FILES.add(rebaseAudio(e.file_ref));
  }
  AUDIO_THINK = m.think || {};
  if (Number.isFinite(m.pause_ms)) AUDIO_PAUSE_MS = m.pause_ms;
}
const audioAllowed = (src) => !!src && AUDIO_FILES.has(src);
function slideAudioSrc(unitId, slideId) {
  const src = `${AUDIO_ROOT}/sessions/${unitId}.${slideId}.mp3`;
  return audioAllowed(src) ? src : null;
}
// Four-movement arc, or null when any movement is missing (then the card
// renders "audio pending" and the text path is untouched).
function cardAudioSrcs(cardId, sectionId) {
  const thinkFile = sectionId ? AUDIO_THINK[sectionId] : null;
  const srcs = {
    q: `${AUDIO_ROOT}/${cardId}.q.mp3`,
    think: thinkFile ? `${AUDIO_ROOT}/${thinkFile}` : "",
    a: `${AUDIO_ROOT}/${cardId}.a.mp3`,
    teach: `${AUDIO_ROOT}/${cardId}.teach.mp3`
  };
  if (!srcs.q || !srcs.think || !srcs.a || !srcs.teach) return null;
  if (!audioAllowed(srcs.q) || !audioAllowed(srcs.think) || !audioAllowed(srcs.a) || !audioAllowed(srcs.teach)) return null;
  return srcs;
}
function recapAudioSrc(recapCardId) {
  const src = `${AUDIO_ROOT}/${recapCardId}.recap.mp3`;
  return audioAllowed(src) ? src : null;
}
function slideAudioHtml(unitId, sl) {
  const src = slideAudioSrc(unitId, sl.slide_id);
  return src
    ? `<p><button data-slide-audio data-src="${esc(src)}">▶ Play narration</button></p>`
    : `<p class="muted">audio pending</p>`;
}
function cardPlayHtml(cardId, sectionId) {
  const arc = cardAudioSrcs(cardId, sectionId);
  return arc
    ? `<button data-card-audio data-q="${esc(arc.q)}" data-think="${esc(arc.think)}" data-a="${esc(arc.a)}" data-teach="${esc(arc.teach)}" data-pause-ms="${esc(String(AUDIO_PAUSE_MS))}">▶ Play narration</button>`
    : `<span class="muted">audio pending</span>`;
}
function recapPlayHtml(recap) {
  const src = recap && recap.card_id ? recapAudioSrc(recap.card_id) : null;
  return src
    ? `<p><button data-recap-audio data-src="${esc(src)}">▶ Play recap</button></p>`
    : `<p class="muted">audio pending</p>`;
}

// One shared HTMLAudioElement; a generation token cancels stale chains.
// No autoplay: playback starts only from a tap. route() calls stopAudio().
let audioEl = null;
let audioBtn = null;
let audioGen = 0;
let audioTimer = 0;
function ensureAudioEl() {
  if (!audioEl) {
    if (typeof window === "undefined" || !window.Audio) return null;
    try { audioEl = new window.Audio(); } catch { return null; }
  }
  return audioEl;
}
function stopAudio() {
  audioGen += 1;
  if (audioTimer) { try { clearTimeout(audioTimer); } catch { /* no-op */ } audioTimer = 0; }
  if (audioEl) {
    try { audioEl.pause(); } catch { /* no-op */ }
    try { audioEl.removeAttribute("src"); audioEl.load(); } catch { /* no-op */ }
    audioEl.onended = audioEl.onerror = null;
    audioEl._src = null;
  }
  if (audioBtn) {
    audioBtn.textContent = audioBtn.hasAttribute("data-recap-audio") ? "▶ Play recap" : "▶ Play narration";
    audioBtn = null;
  }
}
// Single clip with Play/Pause toggle (lesson slides, deck recaps).
function playOne(src, btn) {
  if (!audioAllowed(src)) return false;
  const el = ensureAudioEl();
  if (!el) return false;
  if (audioBtn === btn && el._src === src) {
    if (el.paused) {
      try { const p = el.play(); if (p && p.catch) p.catch(() => { stopAudio(); }); } catch { stopAudio(); return false; }
      btn.textContent = btn.hasAttribute("data-recap-audio") ? "⏸ Pause recap" : "⏸ Pause";
    } else {
      try { el.pause(); } catch { /* no-op */ }
      btn.textContent = btn.hasAttribute("data-recap-audio") ? "▶ Play recap" : "▶ Play narration";
    }
    return true;
  }
  stopAudio();
  const gen = audioGen;
  const el2 = ensureAudioEl();
  if (!el2) return false;
  audioBtn = btn;
  el2._src = src;
  try { el2.src = src; } catch { stopAudio(); return false; }
  btn.textContent = btn.hasAttribute("data-recap-audio") ? "⏸ Pause recap" : "⏸ Pause";
  el2.onended = () => { if (audioGen === gen) stopAudio(); };
  el2.onerror = () => { if (audioGen === gen) stopAudio(); };
  try {
    const p = el2.play();
    if (p && p.catch) p.catch(() => { if (audioGen === gen) stopAudio(); });
  } catch { if (audioGen === gen) stopAudio(); return false; }
  return true;
}
// Flashcard arc: question → think cue → pause_ms wait → answer (reveals the
// answer as it starts) → teaching. Tapping again stops. The manual Recall
// reveal path is independent and always works.
function playCardArc(srcs, pauseMs, btn, card) {
  const el = ensureAudioEl();
  if (!el) return false;
  if (audioBtn === btn) { stopAudio(); return true; }
  stopAudio();
  const gen = audioGen;
  const el2 = ensureAudioEl();
  if (!el2) return false;
  audioBtn = btn;
  btn.textContent = "⏹ Stop narration";
  const ans = card ? card.querySelector("[data-answer]") : null;
  const beat = card ? card.querySelector("[data-beat]") : null;
  const recallBtn = card ? card.querySelector("[data-recall]") : null;
  const revealNow = () => {
    if (ans && ans.hidden) {
      ans.hidden = false;
      if (beat) beat.hidden = true;
      if (recallBtn) { recallBtn.disabled = true; recallBtn.textContent = "Answer shown"; }
    }
  };
  const seq = [
    { src: srcs.q },
    { src: srcs.think },
    { wait: pauseMs },
    { src: srcs.a, onStart: revealNow },
    { src: srcs.teach }
  ];
  let i = 0;
  const step = () => {
    if (audioGen !== gen) return;
    if (i >= seq.length) { stopAudio(); return; }
    const s = seq[i++];
    if (s.wait) {
      audioTimer = setTimeout(() => { audioTimer = 0; step(); }, s.wait);
      return;
    }
    if (!audioAllowed(s.src)) { stopAudio(); return; }
    if (s.onStart) s.onStart();
    try {
      el2._src = s.src;
      el2.src = s.src;
      el2.onended = () => step();
      el2.onerror = () => { if (audioGen === gen) stopAudio(); };
      const p = el2.play();
      if (p && p.catch) p.catch(() => { if (audioGen === gen) stopAudio(); });
    } catch { if (audioGen === gen) stopAudio(); }
  };
  step();
  return true;
}

let D = null;

// ---- Real-data accessors (accepted belt artifacts only) ----
function realEntries() {
  const list = (R && R.manifest && R.manifest.files) || [];
  return {
    dossier: list.filter((e) => e.stage_id === "02.dossier_sections"),
    kg: list.filter((e) => e.stage_id === "03.combined_kg"),
    cards: list.filter((e) => e.stage_id === "04.cards"),
    exam: list.filter((e) => e.stage_id === "06.exam_bank"),
    sessions: list.filter((e) => e.stage_id === "05.sessions"),
    scripts: list.filter((e) => e.stage_id === "05.card_scripts"),
    other: list.filter((e) => e.stage_id !== "02.dossier_sections" && e.stage_id !== "03.combined_kg" && e.stage_id !== "04.cards" && e.stage_id !== "06.exam_bank" && e.stage_id !== "05.sessions" && e.stage_id !== "05.card_scripts")
  };
}
function realArt(entry) {
  if (!entry) return null;
  return (R.files || {})[relKey(ST ? ST.data_root : "data/real", entry.file)] || null;
}
function kgDocs() {
  const { kg } = realEntries();
  return kg.map((e) => ({ entry: e, art: realArt(e) })).filter((x) => x.art);
}
// Modules across every section with an accepted KG. Belt ids are already
// namespaced per section (sec05-m01 …); Section 9 keeps unprefixed ids and is
// told apart by its export entry's section_id.
function modulesReal(sectionId) {
  const out = [];
  for (const { entry, art: kg } of kgDocs()) {
    if (sectionId && entry.section_id !== sectionId) continue;
    const hints = Array.isArray(kg.curriculum_unit_hints) ? kg.curriculum_unit_hints : [];
    const hintByModule = {};
    hints.forEach((h) => { hintByModule[h.module_id] = h; });
    for (const m of (Array.isArray(kg.modules) ? kg.modules : [])) {
      out.push({
        module_id: m.module_id,
        title: m.title,
        domain: m.domain,
        nodeCount: (m.node_ids || []).length,
        unit_id: (hintByModule[m.module_id] || {}).unit_id || null,
        section_id: entry.section_id || "unknown"
      });
    }
  }
  return out;
}
// Sections with an accepted KG, in handbook order — the built chapters.
function builtSections() {
  const has = new Set(modulesReal().map((m) => m.section_id));
  return SECTIONS.filter((s) => has.has(s.id));
}
function unitForModule(moduleId) {
  const m = modulesReal().find((x) => x.module_id === moduleId);
  return m ? m.unit_id : null;
}
function moduleForUnit(unitId) {
  const m = modulesReal().find((x) => x.unit_id === unitId);
  return m ? m.module_id : null;
}
function sessionUnit(unitId) {
  const { sessions } = realEntries();
  for (const e of sessions) {
    const art = realArt(e);
    const u = ((art && art.units) || []).find((x) => x.unit_id === unitId);
    if (u) return u;
  }
  return null;
}
function deckForUnit(unitId) {
  const moduleId = moduleForUnit(unitId);
  const { cards } = realEntries();
  const out = [];
  for (const e of cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) {
      for (const c of (d.cards || [])) {
        if (c.unit_id === unitId || (moduleId && c.module_id === moduleId)) out.push(c);
      }
    }
  }
  const seen = new Set();
  return out.filter((c) => (seen.has(c.card_id) ? false : (seen.add(c.card_id), true)));
}
function scriptsByCard() {
  const { scripts } = realEntries();
  const byCard = {};
  for (const e of scripts) {
    const art = realArt(e);
    for (const s of ((art && art.audio_scripts) || [])) {
      if (!s.is_recap) byCard[s.card_id] = s;
    }
  }
  return byCard;
}
function recapForModule(moduleId) {
  const { scripts } = realEntries();
  for (const e of scripts) {
    const art = realArt(e);
    const r = ((art && art.audio_scripts) || []).find((s) => s.is_recap && s.module_id === moduleId);
    if (r) return r;
  }
  return null;
}
function examDocs() {
  const { exam } = realEntries();
  return exam.map((e) => ({ entry: e, art: realArt(e) })).filter((x) => x.art);
}
function examItemsById() {
  const byId = {};
  for (const { entry, art: doc } of examDocs()) {
    for (const it of (doc.items || [])) byId[it.item_id] = { ...it, section_id: entry.section_id };
  }
  return byId;
}
function moduleQuizForUnit(unitId) {
  for (const { entry, art: doc } of examDocs()) {
    const q = (doc.module_quizzes || []).find((x) => x.unit_id === unitId);
    if (q) return { ...q, section_id: entry.section_id };
  }
  return null;
}
function practiceForms() {
  const out = [];
  for (const { entry, art: doc } of examDocs()) {
    for (const f of (doc.practice_forms || [])) out.push({ ...f, section_id: entry.section_id });
  }
  return out;
}
// fact id -> {ref, section}, from accepted KG node + card + item source refs
function factPageMap() {
  const map = {};
  const put = (f, ref, section) => { if (f && !map[f] && ref) map[f] = { ref, section }; };
  for (const { entry, art: kg } of kgDocs()) {
    for (const n of (kg.nodes || [])) {
      for (const f of (n.fact_ids || [n.id])) put(f, n.source_ref, entry.section_id);
    }
  }
  for (const { entry, art: doc } of examDocs()) {
    for (const c of (doc.items || [])) {
      for (const f of (c.fact_ids || [])) put(f, c.source_ref, entry.section_id);
    }
  }
  const { cards } = realEntries();
  for (const e of cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) {
      for (const c of (d.cards || [])) {
        for (const f of (c.claims_fact_ids || [])) put(f, c.source_ref, e.section_id);
      }
    }
  }
  return map;
}
let _factPages = null;
function sourceLine(factIds) {
  if (!_factPages) _factPages = factPageMap();
  const ids = (factIds || []).filter(Boolean);
  const secOf = (f) => (_factPages[f] || {}).section || null;
  const secs = [...new Set(ids.map(secOf).filter(Boolean))];
  const label = secs.length === 1 ? shortSection(secs[0]) : HB();
  if (!ids.length) return `<p class="muted">Source: <a href="${P()}dossier">${esc(HB())}</a></p>`;
  const pages = ids.map((f) => {
    const rec = _factPages[f] || {};
    const ref = rec.ref;
    const pg = ref && (ref.printed_page || ref.pdf_page) ? `, p. ${esc(ref.printed_page || ("PDF " + ref.pdf_page))}` : "";
    return `<a href="${P()}dossier">${esc(f)}</a>${pg}`;
  }).join(" · ");
  return `<p class="muted">Source: ${pages} · ${esc(label)}</p>`;
}

function vQuiz(unitId) {
  const quiz = moduleQuizForUnit(unitId);
  if (!quiz) {
    const sec = sectionOfUnit(unitId);
    return sec ? realPending(sec, "Quiz") : vMissing();
  }
  return realQuizBlock(quiz.item_ids, "quiz:" + quiz.quiz_id, quiz.title,
    "Module quiz with supported rationales. Missed questions are listed for review after you check.", null)
    + `<p><a class="btn" href="${P()}module/${esc(moduleForUnit(unitId) || "")}">Back to module hub</a> <a class="btn" href="${P()}practice">Try a practice test</a></p>`;

function vPractice(formId) {
  const forms = practiceForms();
  if (!forms.length) return realEmpty("exam bank");
  if (formId) {
    const f = forms.find((x) => x.form_id === formId);
    if (!f) return vMissing();
    return realQuizBlock(f.item_ids, "form:" + f.form_id, f.title,
      "Full practice form drawn from the accepted exam bank. Scores describe observed practice only — never licensing eligibility, driving competence, or predicted success.",
      `${f.title} — practice form`)
      + `<p><a class="btn" href="${P()}practice">Choose the other form</a> <a class="btn" href="${P()}">Back home</a></p>`;

  const bySec = {};
  for (const f of forms) { (bySec[f.section_id] = bySec[f.section_id] || []).push(f); }
  return `<h1>Practice tests — ${esc(HB())}</h1>
  <p class="muted">${esc(REAL_NOTE)}. ${forms.length} accepted practice forms across ${Object.keys(bySec).length} chapter(s). Practice only — no official pass claim.</p>

  return `<h1>Results — observed practice only</h1>
  <p class="muted">${esc(REAL_NOTE)}.</p>
  <div class="card"><h2>${esc(r.title)}</h2>
  <p>You answered <b>${r.correctCount} of ${r.answers.length}</b> in this practice set, taken ${esc(r.takenAt)}.</p>

function vMissing() { return `<h1>Nothing here</h1><p>That module or unit is not part of this course.</p><p><a class="btn" href="${P()}chapters">Modules</a></p>`; }

function factBlocks(md) {
  return String(md || "").split(/(?=^FACT_ID: )/m).map((b) => b.trim()).filter(Boolean);
}

  <p><a class="btn" href="${P()}real-cards">Continue to the real flashcards</a></p>`;
}

function realGradeQuiz(form, formId, title) {
  const answers = [];
  form.querySelectorAll("[data-ritem]").forEach((box) => {
    const correct = box.dataset.correct;
    const why = box.dataset.why || "";
    const stem = box.dataset.stem || box.dataset.ritem;
    const pickedBtn = box.querySelector(".option[aria-pressed='true']");
    const picked = pickedBtn ? pickedBtn.dataset.key : null;
    const ok = picked === correct;
    const options = [];
    box.querySelectorAll(".option").forEach((b) => {
      options.push({ key: b.dataset.key, text: b.dataset.otext || b.textContent || "", rationale: b.dataset.orationale || "" });
    });
    answers.push({ itemId: box.dataset.ritem, picked, correct: ok, stem, why, key: correct, options });
    const fb = box.querySelector("[data-feedback]");
    fb.hidden = false;
    const optLines = options.map((o) => `<br>· <b>${esc(o.key)}.</b> ${esc(o.text)} — ${esc(o.rationale || "")}`).join("");
    fb.innerHTML = picked
      ? (ok ? `<p class="result-good">Correct.</p>` : `<p class="result-bad">Not quite — you chose ${esc(picked)}.</p>`) + `<p><b>Why ${esc(correct)}:</b> ${esc(why)}${optLines}</p>`
      : `<p class="result-bad">No answer chosen.</p><p><b>Correct answer ${esc(correct)}:</b> ${esc(why)}${optLines}</p>`;
    box.querySelectorAll(".option").forEach((b) => {
      b.disabled = true;
      if (b.dataset.key === correct) b.classList.add("picked-correct");
      else if (b.getAttribute("aria-pressed") === "true") b.classList.add("picked-wrong");
      else b.classList.add("dim");
    });
  });
  const correctCount = answers.filter((a) => a.correct).length;
  const attemptId = "attempt-" + Date.now().toString(36);
  saveResult({ attemptId, formId, title, answers, correctCount, takenAt: new Date().toISOString() });
  form.querySelector("[data-summary]").innerHTML =
    `<div class="card"><h2>You answered ${correctCount} of ${answers.length}</h2>
    <p class="muted">Observed practice only — never licensing eligibility or predicted success.</p>
    <p><a class="btn" href="${P()}results/${attemptId}">See results and next steps</a></p></div>`;
  form.querySelector("[data-summary]").scrollIntoView();
}

function wire(sub) {
  view.querySelectorAll("[data-reveal]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const ans = btn.closest(".card").querySelector("[data-answer]");
      ans.hidden = !ans.hidden;
      btn.textContent = ans.hidden ? "Reveal answer" : "Hide answer";
    });
  });
  view.querySelectorAll("[data-recall]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const card = btn.closest(".card");
      const beat = card.querySelector("[data-beat]");
      const ans = card.querySelector("[data-answer]");
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        ans.hidden = false;
        btn.textContent = "Answer shown";
        return;
      }
      beat.hidden = false;
      let left = 3;
      beat.textContent = `Take about ${left} seconds to recall…`;
      const tick = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(tick);
          beat.hidden = true;
          ans.hidden = false;
          btn.textContent = "Answer shown";
        } else {
          beat.textContent = `Take about ${left} seconds to recall…`;
        }
      }, 1000);
    });
  });
  view.querySelectorAll("[data-slide-audio]").forEach((btn) => {
    btn.addEventListener("click", () => playOne(btn.dataset.src || "", btn));
  });
  view.querySelectorAll("[data-recap-audio]").forEach((btn) => {

      const pauseMs = Number(btn.dataset.pauseMs || AUDIO_PAUSE_MS) || AUDIO_PAUSE_MS;

  });

  if (ST && sub && sub[0] === "lesson" && sub[1]) markDone(sub[1], "lesson");
  if (ST && sub && sub[0] === "cards" && sub[1]) markDone(sub[1], "cards");
  view.querySelectorAll(".option").forEach((b) => {
    b.addEventListener("click", () => {
      const scope = b.closest("[data-ritem]") || b.closest("[data-sitem]");
      if (scope) scope.querySelectorAll(".option").forEach((x) => x.removeAttribute("aria-pressed"));
      b.setAttribute("aria-pressed", "true");
    });
  });
  view.querySelectorAll("form[data-rquiz]").forEach((form) => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();

    });
  });
  view.querySelectorAll("form[data-squiz]").forEach((form) => {

      e.preventDefault();

    });

  const reset = view.querySelector("#reset-progress");
  if (reset) reset.addEventListener("click", () => {
    localStorage.removeItem(store.key);
    view.querySelector("[data-reset-done]")?.remove();
    reset.insertAdjacentHTML("afterend", `<p data-reset-done class="result-good">Preview progress erased on this device.</p>`);
  });
}

// ---- Study flow (2026-10-31): lesson video frame + module step bar ----
// Lesson videos are optional per state, by convention at video/<xx>/video-manifest.json (studio renders that
// combine the lesson slides, their narration and scene illustrations; tools/video/onboard-videos.mjs writes it).
// The step bar is data-driven (module → lesson, flashcards, quiz + saved progress) and works for every state.
// Both are post-render enhancements: they read the DOM the view produced and never change the view functions.
const STEP_ROUTES = new Set(["lesson", "cards", "quiz"]);
const VIDEO_CACHE = {}; // state code -> manifest | null (none) | Promise while loading
function ensureVideoManifest(s) {
  if (!s) return Promise.resolve(null);
  const v = VIDEO_CACHE[s.code];
  if (v === null || (v && typeof v.then !== "function")) return Promise.resolve(v);
  if (v) return v;
  const root = trimSlash(s.video_root || ("video/" + slugOf(s)));
  const p = fetch(root + "/video-manifest.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null)).catch(() => null)
    .then((m) => { VIDEO_CACHE[s.code] = m && m.units ? { ...m, root } : null; return VIDEO_CACHE[s.code]; });
  VIDEO_CACHE[s.code] = p;
  return p;
}
const fmtTime = (t) => { t = Math.max(0, Math.round(Number(t) || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

function stepInfo(unitId) {
  const moduleId = moduleForUnit(unitId);
  const m = moduleId ? modulesReal().find((x) => x.module_id === moduleId) : null;
  const saved = store.read();
  const prog = (saved.progress || {})[unitId] || {};
  const quiz = moduleQuizForUnit(unitId);
  const quizDone = !!quiz && Object.values(saved.results || {}).some((r) => r && r.formId === "quiz:" + quiz.quiz_id);
  return { moduleId, module: m, hasLesson: !!sessionUnit(unitId), hasCards: deckForUnit(unitId).length > 0, hasQuiz: !!quiz,
    lessonDone: !!prog.lesson, cardsDone: !!prog.cards, quizDone };
}

function renderStepBar(sub) {
  const p0 = sub[0], unitId = decodeURIComponent(sub[1] || "");
  const info = stepInfo(unitId);
  if (!info.module) return;
  const steps = [
    { key: "lesson", label: "Lesson", href: P() + "lesson/" + encodeURIComponent(unitId), has: info.hasLesson, done: info.lessonDone },
    { key: "cards", label: "Flashcards", href: P() + "cards/" + encodeURIComponent(unitId), has: info.hasCards, done: info.cardsDone },
    { key: "quiz", label: "Quiz", href: P() + "quiz/" + encodeURIComponent(unitId), has: info.hasQuiz, done: info.quizDone },
  ];
  const idx = steps.findIndex((s) => s.key === p0);
  const cur = steps[idx];
  const next = steps.slice(idx + 1).find((s) => s.has);
  const hubHref = P() + "module/" + encodeURIComponent(info.moduleId);
  const bar = document.createElement("nav");
  bar.className = "step-bar";
  bar.setAttribute("aria-label", "Module steps");
  bar.innerHTML = `<div class="sb-steps">${steps.map((s, i) => `${i ? '<span class="sb-sep" aria-hidden="true"></span>' : ""}<a class="sb-step" href="${esc(s.href)}" data-state="${s.key === p0 ? "current" : s.done ? "done" : "todo"}"${s.has ? "" : ' aria-disabled="true"'}${s.key === p0 ? ' aria-current="step"' : ""}><span class="sb-dot" aria-hidden="true">${s.done && s.key !== p0 ? "✓" : i + 1}</span><span class="sb-label">${s.label}</span></a>`).join("")}</div>
    <div class="sb-actions"><a class="btn secondary" href="${esc(hubHref)}">Module</a>${p0 !== "quiz" && !cur.done ? `<button class="btn secondary" type="button" data-mark-done="${esc(p0)}" title="Mark the ${cur.label.toLowerCase()} as done">Mark done</button>` : ""}<a class="btn" href="${esc(next ? next.href : hubHref)}" data-next-step>${next ? "Next: " + next.label : "Finish module"} →</a></div>`;
  view.appendChild(bar);
  const mark = bar.querySelector("[data-mark-done]");
  if (mark) mark.addEventListener("click", () => { markDone(unitId, p0); refreshStepBar(sub); });
}
function refreshStepBar(sub) { const old = view.querySelector(".step-bar"); if (old) old.remove(); renderStepBar(sub); }

// Slide containers in the rendered lesson (any layout): the element whose own text starts "Slide k of n".
function lessonSlideElements() {
  const out = {};
  for (const el of view.querySelectorAll("h2, h3, h4, p, span, div")) {
    if (el.children.length > 2) continue;
    const m = (el.textContent || "").trim().match(/^slide\s+(\d+)\s+of\s+\d+/i);
    if (!m) continue;
    const k = Number(m[1]);
    if (!out[k]) out[k] = el.closest(".card, article, section, li") || el.parentElement || el;
  }
  return out;
}

let lpKeyHandler = null;
function renderLessonPlayer(unitId, sub) {
  const vm = VIDEO_CACHE[ST && ST.code];
  if (!vm || typeof vm.then === "function" || !vm.units || !vm.units[unitId]) return;
  if (view.querySelector(".lesson-player")) return;
  const u = vm.units[unitId];
  const unit = sessionUnit(unitId);
  const slides = u.slides || [];
  const total = Number(u.duration) || 0;
  const label = (i) => { const sl = unit && unit.slides && unit.slides[i]; const t = sl && sl.title && sl.title.text; return t || (slides[i] && slides[i].kind ? slides[i].kind.replace(/_/g, " ") : "Slide " + (i + 1)); };
  const wrap = document.createElement("section");
  wrap.className = "lesson-player";
  wrap.setAttribute("aria-label", "Lesson video");
  wrap.innerHTML = `<div class="lp-head"><p class="lp-title">${esc(unit && unit.title ? unit.title.text : (u.title || "Lesson"))}</p><span class="lp-meta">${slides.length} slides · ${fmtTime(total)} · narrated lesson video</span></div>
    <div class="lp-stage"><video playsinline preload="metadata" controls controlslist="nodownload"${u.poster ? ` poster="${esc(u.poster)}"` : ""} src="${esc(u.file)}"></video></div>
    <div class="lp-progress" aria-hidden="true"><div class="lp-fill"></div>${total ? slides.map((s) => `<span class="lp-tick" style="left:${(100 * (Number(s.start) || 0) / total).toFixed(2)}%"></span>`).join("") : ""}</div>
    <div class="lp-bar"><button type="button" class="btn" data-lp-play>▶ Play lesson</button><button type="button" data-lp-back title="Back 10 seconds (left arrow)">↶ 10s</button><button type="button" data-lp-fwd title="Forward 10 seconds (right arrow)">10s ↷</button><span class="lp-spacer"></span><label class="lp-meta">Speed <select data-lp-rate><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label class="lp-meta"><input type="checkbox" data-lp-follow checked> Follow the transcript</label></div>
    <div class="lp-chapters" aria-label="Lesson chapters">${slides.map((s, i) => `<button type="button" data-lp-idx="${i}" data-lp-seek="${Number(s.start) || 0}" aria-current="${i === 0 ? "true" : "false"}">${i + 1}. ${esc(label(i))}</button>`).join("")}</div>
    <div class="lp-done" hidden>✓ Lesson complete. Continue to the flashcards.</div>`;
  const h1 = view.querySelector("h1");
  if (h1) h1.insertAdjacentElement("afterend", wrap); else view.prepend(wrap);

  const video = wrap.querySelector("video"), fill = wrap.querySelector(".lp-fill"), playBtn = wrap.querySelector("[data-lp-play]");
  const chapters = [...wrap.querySelectorAll("[data-lp-idx]")], follow = wrap.querySelector("[data-lp-follow]");
  const slideEls = lessonSlideElements();
  let active = -1, finished = false;
  const idxAt = (t) => { let i = 0; for (let k = 0; k < slides.length; k++) if (t + 0.05 >= (Number(slides[k].start) || 0)) i = k; return i; };
  const setActive = (i, scroll) => {
    if (i === active) return;
    active = i;
    chapters.forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
    view.querySelectorAll(".lp-follow-active").forEach((el) => el.classList.remove("lp-follow-active"));
    const el = slideEls[i + 1];
    if (el) { el.classList.add("lp-follow-active"); if (scroll && follow.checked) el.scrollIntoView({ block: "start", behavior: "smooth" }); }
  };
  video.addEventListener("timeupdate", () => { if (total) fill.style.width = Math.min(100, 100 * video.currentTime / total).toFixed(2) + "%"; setActive(idxAt(video.currentTime), true); });
  video.addEventListener("play", () => { stopAudio(); playBtn.textContent = "⏸ Pause"; });
  video.addEventListener("pause", () => { playBtn.textContent = video.ended ? "↻ Replay lesson" : "▶ Resume lesson"; });
  video.addEventListener("ended", () => { finished = true; markDone(unitId, "lesson"); wrap.querySelector(".lp-done").hidden = false; playBtn.textContent = "↻ Replay lesson"; refreshStepBar(sub); });
  video.addEventListener("error", () => { wrap.querySelector(".lp-stage").insertAdjacentHTML("beforeend", `<p class="muted" style="color:#fff;padding:12px">This lesson's video is not available right now. The narrated slides below still work.</p>`); });
  playBtn.addEventListener("click", () => { if (video.paused) { if (finished && video.ended) video.currentTime = 0; video.play().catch(() => {}); } else video.pause(); });
  wrap.querySelector("[data-lp-back]").addEventListener("click", () => { video.currentTime = Math.max(0, video.currentTime - 10); });
  wrap.querySelector("[data-lp-fwd]").addEventListener("click", () => { video.currentTime = Math.min(total || video.duration || 1e9, video.currentTime + 10); });
  wrap.querySelector("[data-lp-rate]").addEventListener("change", (e) => { video.playbackRate = Number(e.target.value) || 1; });
  chapters.forEach((b) => b.addEventListener("click", () => { video.currentTime = Number(b.dataset.lpSeek) || 0; setActive(Number(b.dataset.lpIdx), true); if (video.paused) video.play().catch(() => {}); }));
  // narration buttons on the slides pause the video; the video pauses the narration (play handler above)
  view.querySelectorAll("[data-slide-audio], [data-card-audio], [data-recap-audio]").forEach((b) => b.addEventListener("click", () => { if (!video.paused) video.pause(); }));
  lpKeyHandler = (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); playBtn.click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); }
    else if (e.key === "ArrowRight") { e.preventDefault(); video.currentTime = video.currentTime + 10; }
    else if (e.key === "j" || e.key === "l") { e.preventDefault(); const n = Math.max(0, Math.min(slides.length - 1, active + (e.key === "l" ? 1 : -1))); chapters[n] && chapters[n].click(); }
  };
  document.addEventListener("keydown", lpKeyHandler);
  setActive(0, false);
}

function enhanceStudyFlow(sub) {
  if (lpKeyHandler) { document.removeEventListener("keydown", lpKeyHandler); lpKeyHandler = null; }
  if (!ST || !sub || !sub[0]) return;
  const p0 = sub[0], unitId = decodeURIComponent(sub[1] || "");
  if (!STEP_ROUTES.has(p0) || !unitId) return;

  if (p0 === "lesson") {

    ensureVideoManifest(ST).then(() => { if (gen !== routeGen) return; if (view.querySelector("[data-gate-buy]")) return; try { renderLessonPlayer(unitId, sub); } catch (e) { console.warn("lesson player:", e); } });
  }
}

// One state's course: sub = parts after "#/<xx>/".
function routeState(sub) {
  const p0 = sub[0] || "";
  let html = "", nav = "home", banner = "real", bannerText = REAL_NOTE;
  if (p0 === "") html = vHome();
  else if (p0 === "chapters") { html = vChapters(); nav = "chapters"; }
  else if (p0 === "chapter") html = vChapter(decodeURIComponent(sub[1] || ""));
  else if (p0 === "module") html = vModule(decodeURIComponent(sub[1] || ""));
  else if (p0 === "lesson") html = vLesson(decodeURIComponent(sub[1] || ""));
  else if (p0 === "cards") html = vCards(decodeURIComponent(sub[1] || ""));
  else if (p0 === "quiz") html = vQuiz(decodeURIComponent(sub[1] || ""));
  else if (p0 === "practice" && sub[1]) { html = vPractice(decodeURIComponent(sub[1])); nav = "practice"; }
  else if (p0 === "practice") { html = vPractice(null); nav = "practice"; }
  else if (p0 === "results") html = vResults(decodeURIComponent(sub[1] || ""));
  else if (p0 === "settings") { html = vSettings(); nav = "settings"; }
  else if (p0 === "dossier") { html = vDossier(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (p0 === "modules") { html = vModules(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (p0 === "real-cards") { html = vRealCards(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (p0 === "real-quiz") { html = vRealQuiz(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (p0 === "real-lesson") { html = vRealLesson(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else html = vMissing();
  if (banner === "review") {
    const re = realEntries();
    const n = p0 === "dossier" ? re.dossier.length + re.kg.length + re.cards.length + re.exam.length + re.sessions.length + re.scripts.length + re.other.length : p0 === "modules" ? re.kg.length : p0 === "real-quiz" ? re.exam.length : p0 === "real-lesson" ? re.sessions.length : re.cards.length + re.scripts.length;
    if (n) { banner = "real"; bannerText = REAL_NOTE; }

// Header: brand, title and state-scoped nav links follow the active state.

let routeGen = 0;
function route() {
  stopAudio();
  const gen = ++routeGen;
  const rerender = () => { if (gen === routeGen) route(); };
  let h = location.hash || "#/";
  let parts = h.replace(/^#\/?/, "").split("/");
  // Legacy unprefixed routes -> Utah (kept for one release).
  if (LEGACY_ROUTES.has(parts[0])) {
    h = "#/" + LEGACY_STATE + "/" + parts.join("/");
    try {
      if (typeof history !== "undefined" && history.replaceState) history.replaceState(null, "", h);
      else location.hash = h;
    } catch { location.hash = h; }
    parts = h.replace(/^#\//, "").split("/");
  }
  let out = null, navState = null, sub = null;
  if (!STATES) {
    out = { html: vLoading("the state list"), nav: "states", banner: "real", bannerText: PICKER_NOTE };
  } else if (parts[0] === "") {
    const missing = STATES.filter((s) => s.status === "complete" && !SUMMARY[s.code]);
    if (missing.length) {
      Promise.all(missing.map((s) => ensureSummary(s).catch(() => (SUMMARY[s.code] = { ok: false })))).then(rerender);
      out = { html: vLoading("the state courses"), nav: "states", banner: "real", bannerText: PICKER_NOTE };
    } else {
      out = { html: vPicker(), nav: "states", banner: "real", bannerText: PICKER_NOTE };
    }
  } else if (parts[0] === "synthetic-sample") {
    out = { html: vSyntheticSample(), nav: "", banner: "synthetic", bannerText: SYNTHETIC_NOTE };
    navState = ST;
  } else {
    const s = stateBySlug(parts[0]);
    if (!s) out = { html: vNoState(parts[0]), nav: "", banner: "real", bannerText: PICKER_NOTE };
    else if (s.status !== "complete") out = { html: vComingSoon(s), nav: "", banner: "real", bannerText: PICKER_NOTE };
    else if (!STATE_CACHE[s.code]) {
      ensureState(s).then(rerender, rerender);
      out = { html: vLoading(`the ${s.name} course`), nav: "home", banner: "real", bannerText: PICKER_NOTE };
      navState = s;
    } else {
      activateState(s);
      navState = s;
      sub = parts.slice(1);
      out = routeState(sub);
    }
  }
  setBanner(out.banner, out.bannerText);
  view.innerHTML = out.html;
  setChrome(navState, out.nav);
  wire(sub);
  enhanceStudyFlow(sub);
  view.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
loadStates()
  .then((st) => { STATES = st.list; STATES_FROM = st.from; })
  .then(() => loadData().then((d) => { D = d; }, () => { /* synthetic sample stays unavailable; the course still loads */ }))
  .then(() => { route(); })
  .catch(() => {});
</script>
</body>
</html>
