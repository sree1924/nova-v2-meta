<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utah Driver Handbook — Written-Test Prep</title>
<link rel="stylesheet" href="styles.css">
<script src="data-embedded.js" defer></script>
<script src="data-real-embedded.js" defer></script>
</head>
<body>
<div class="real-banner" id="banner" role="note">REAL — Utah Driver Handbook, belt-validated, audit pending</div>
<header class="site">
  <div class="wrap">
    <span class="brand">Utah Driver Handbook — Written-Test Prep</span>
    <nav class="main" aria-label="Learner">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/chapters" data-nav="chapters">Chapters</a>
      <a href="#/practice" data-nav="practice">Practice tests</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="site">dev preview — no production claims · text-first pilot, no audio</footer>
<script type="module">
const SYNTHETIC_NOTE = "SYNTHETIC SAMPLE — not Utah content.";
const REAL_NOTE = "REAL — Utah Driver Handbook, belt-validated, audit pending";
// Handbook chapters in handbook order (sec01 … sec16). Titles humanize the
// belt section slugs; only chapters with accepted belt artifacts are built.
const SECTIONS = [
  { id: "sec01-definitions", n: 1, title: "Definitions" },
  { id: "sec02-licensing-requirements", n: 2, title: "Licensing Requirements" },
  { id: "sec03-driver-education-permits", n: 3, title: "Driver Education and Permits" },
  { id: "sec04-license-types-id-documents", n: 4, title: "License Types and ID Documents" },
  { id: "sec05-vision-health", n: 5, title: "Vision and Health" },
  { id: "sec06-examinations", n: 6, title: "Examinations" },
  { id: "sec07-preparing-vehicle", n: 7, title: "Preparing Your Vehicle" },
  { id: "sec08-basic-driving", n: 8, title: "Basic Driving" },
  { id: "sec09-rules-of-the-road", n: 9, title: "Rules of the Road" },
  { id: "sec10-alcohol-drugs", n: 10, title: "Alcohol and Drugs" },
  { id: "sec11-distractions-challenges", n: 11, title: "Distractions and Challenges" },
  { id: "sec12-crashes-insurance", n: 12, title: "Crashes and Insurance" },
  { id: "sec13-suspensions-record", n: 13, title: "Suspensions and Your Record" },
  { id: "sec14-sharing-the-road", n: 14, title: "Sharing the Road" },
  { id: "sec15-vehicle-equipment", n: 15, title: "Vehicle Equipment" },
  { id: "sec16-towing", n: 16, title: "Towing" }
];
const sectionMeta = (id) => SECTIONS.find((s) => s.id === id) || null;
const shortSection = (id) => { const m = sectionMeta(id); return m ? `Chapter ${m.n} — ${m.title}` : "Utah Driver Handbook"; };
const REVIEWER_EMPTY_NOTE = "REVIEWER VIEW — no accepted Utah content yet";

function setBanner(kind, text) {
  const b = document.getElementById("banner");
  b.className = kind === "real" ? "real-banner" : kind === "review" ? "review-banner" : "sample-banner";
  b.textContent = text;
}

let R = null;
async function loadReal() {
  try {
    const manifest = await (await fetch("data/real/manifest.json", {cache: "no-store"})).json();
    const files = {};
    for (const e of manifest.files || []) {
      files[e.file.replace(/^data\/real\//, "")] = await (await fetch(e.file, {cache: "no-store"})).json();
    }
    return { manifest, files, from: "fetch" };
  } catch (e) {
    const emb = window.__REAL_EMBEDDED;
    if (emb) return { manifest: emb.manifest, files: emb.files, from: "embedded-fallback" };
    return { manifest: null, files: {}, from: "none" };
  }
}
const view = document.getElementById("view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- Synthetic sample (comparison only, under #/synthetic-sample) ----
async function loadData() {
  try {
    const get = async (p) => (await fetch(p, {cache: "no-store"})).json();
    const manifest = await get("data/manifest.json");
    const ch = manifest.chapters[0];
    const [cards, teaching, exam] = await Promise.all([
      get("data/" + ch.cards), get("data/" + ch.units[0].teaching), get("data/" + ch.exam)
    ]);
    return { manifest, cards, teaching, exam, from: "fetch" };
  } catch (e) {
    const emb = window.__PREVIEW_EMBEDDED;
    if (!emb) {
      view.innerHTML = "<h1>Could not load sample data</h1><p>No data files found and no embedded fallback. Serve this folder over HTTP or keep data-embedded.js next to index.html.</p>";
      throw e;
    }
    return { ...emb, from: "embedded-fallback" };
  }
}

// ---- Learner progress (real syllabus namespace) ----
const store = {
  key: "nova-preview:v1:ut-handbook",
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  write(s) { localStorage.setItem(this.key, JSON.stringify(s)); }
};
const saveResult = (rec) => { const s = store.read(); s.results = s.results || {}; s.results[rec.attemptId] = rec; store.write(s); };
const getResult = (id) => (store.read().results || {})[id] || null;
const markDone = (unitId, what) => { const s = store.read(); s.progress = s.progress || {}; s.progress[unitId] = s.progress[unitId] || {}; s.progress[unitId][what] = true; store.write(s); };

let D = null;

// ---- Real-data accessors (accepted belt artifacts only) ----
function realEntries() {
  const list = (R && R.manifest && R.manifest.files) || [];
  return {
    dossier: list.filter((e) => e.stage_id === "02.dossier_sections"),
    kg: list.filter((e) => e.stage_id === "03.combined_kg"),
    cards: list.filter((e) => e.stage_id === "04.cards"),
    exam: list.filter((e) => e.stage_id === "06.exam_bank"),
    sessions: list.filter((e) => e.stage_id === "05.sessions"),
    scripts: list.filter((e) => e.stage_id === "05.card_scripts"),
    other: list.filter((e) => e.stage_id !== "02.dossier_sections" && e.stage_id !== "03.combined_kg" && e.stage_id !== "04.cards" && e.stage_id !== "06.exam_bank" && e.stage_id !== "05.sessions" && e.stage_id !== "05.card_scripts")
  };
}
function realArt(entry) {
  if (!entry) return null;
  return (R.files || {})[entry.file.replace(/^data\/real\//, "")] || null;
}
function kgDocs() {
  const { kg } = realEntries();
  return kg.map((e) => ({ entry: e, art: realArt(e) })).filter((x) => x.art);
}
// Modules across every section with an accepted KG. Belt ids are already
// namespaced per section (sec05-m01 …); Section 9 keeps unprefixed ids and is
// told apart by its export entry's section_id.
function modulesReal(sectionId) {
  const out = [];
  for (const { entry, art: kg } of kgDocs()) {
    if (sectionId && entry.section_id !== sectionId) continue;
    const hints = Array.isArray(kg.curriculum_unit_hints) ? kg.curriculum_unit_hints : [];
    const hintByModule = {};
    hints.forEach((h) => { hintByModule[h.module_id] = h; });
    for (const m of (Array.isArray(kg.modules) ? kg.modules : [])) {
      out.push({
        module_id: m.module_id,
        title: m.title,
        domain: m.domain,
        nodeCount: (m.node_ids || []).length,
        unit_id: (hintByModule[m.module_id] || {}).unit_id || null,
        section_id: entry.section_id || "unknown"
      });
    }
  }
  return out;
}
// Sections with an accepted KG, in handbook order — the built chapters.
function builtSections() {
  const has = new Set(modulesReal().map((m) => m.section_id));
  return SECTIONS.filter((s) => has.has(s.id));
}
function unitForModule(moduleId) {
  const m = modulesReal().find((x) => x.module_id === moduleId);
  return m ? m.unit_id : null;
}
function moduleForUnit(unitId) {
  const m = modulesReal().find((x) => x.unit_id === unitId);
  return m ? m.module_id : null;
}
function sessionUnit(unitId) {
  const { sessions } = realEntries();
  for (const e of sessions) {
    const art = realArt(e);
    const u = ((art && art.units) || []).find((x) => x.unit_id === unitId);
    if (u) return u;
  }
  return null;
}
function deckForUnit(unitId) {
  const moduleId = moduleForUnit(unitId);
  const { cards } = realEntries();
  const out = [];
  for (const e of cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) {
      for (const c of (d.cards || [])) {
        if (c.unit_id === unitId || (moduleId && c.module_id === moduleId)) out.push(c);
      }
    }
  }
  const seen = new Set();
  return out.filter((c) => (seen.has(c.card_id) ? false : (seen.add(c.card_id), true)));
}
function scriptsByCard() {
  const { scripts } = realEntries();
  const byCard = {};
  for (const e of scripts) {
    const art = realArt(e);
    for (const s of ((art && art.audio_scripts) || [])) {
      if (!s.is_recap) byCard[s.card_id] = s;
    }
  }
  return byCard;
}
function recapForModule(moduleId) {
  const { scripts } = realEntries();
  for (const e of scripts) {
    const art = realArt(e);
    const r = ((art && art.audio_scripts) || []).find((s) => s.is_recap && s.module_id === moduleId);
    if (r) return r;
  }
  return null;
}
function examDocs() {
  const { exam } = realEntries();
  return exam.map((e) => ({ entry: e, art: realArt(e) })).filter((x) => x.art);
}
function examItemsById() {
  const byId = {};
  for (const { entry, art: doc } of examDocs()) {
    for (const it of (doc.items || [])) byId[it.item_id] = { ...it, section_id: entry.section_id };
  }
  return byId;
}
function moduleQuizForUnit(unitId) {
  for (const { entry, art: doc } of examDocs()) {
    const q = (doc.module_quizzes || []).find((x) => x.unit_id === unitId);
    if (q) return { ...q, section_id: entry.section_id };
  }
  return null;
}
function practiceForms() {
  const out = [];
  for (const { entry, art: doc } of examDocs()) {
    for (const f of (doc.practice_forms || [])) out.push({ ...f, section_id: entry.section_id });
  }
  return out;
}
// fact id -> {ref, section}, from accepted KG node + card + item source refs
function factPageMap() {
  const map = {};
  const put = (f, ref, section) => { if (f && !map[f] && ref) map[f] = { ref, section }; };
  for (const { entry, art: kg } of kgDocs()) {
    for (const n of (kg.nodes || [])) {
      for (const f of (n.fact_ids || [n.id])) put(f, n.source_ref, entry.section_id);
    }
  }
  for (const { entry, art: doc } of examDocs()) {
    for (const c of (doc.items || [])) {
      for (const f of (c.fact_ids || [])) put(f, c.source_ref, entry.section_id);
    }
  }
  const { cards } = realEntries();
  for (const e of cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) {
      for (const c of (d.cards || [])) {
        for (const f of (c.claims_fact_ids || [])) put(f, c.source_ref, e.section_id);
      }
    }
  }
  return map;
}
let _factPages = null;
function sourceLine(factIds) {
  if (!_factPages) _factPages = factPageMap();
  const ids = (factIds || []).filter(Boolean);
  const secOf = (f) => (_factPages[f] || {}).section || null;
  const secs = [...new Set(ids.map(secOf).filter(Boolean))];
  const label = secs.length === 1 ? shortSection(secs[0]) : "Utah Driver Handbook";
  if (!ids.length) return `<p class="muted">Source: <a href="#/dossier">Utah Driver Handbook</a></p>`;
  const pages = ids.map((f) => {
    const rec = _factPages[f] || {};
    const ref = rec.ref;
    const pg = ref && (ref.printed_page || ref.pdf_page) ? `, p. ${esc(ref.printed_page || ("PDF " + ref.pdf_page))}` : "";
    return `<a href="#/dossier">${esc(f)}</a>${pg}`;
  }).join(" · ");
  return `<p class="muted">Source: ${pages} · ${esc(label)}</p>`;
}

// ---- Learner views (REAL Utah Driver Handbook) ----
// Aggregate counts straight from the exports: chapters built = sections with
// an accepted KG; cards/items/lessons summed over accepted artifacts.
function handbookCounts() {
  const mods = modulesReal();
  const byId = examItemsById();
  let cards = 0;
  for (const e of realEntries().cards) {
    const art = realArt(e);
    for (const d of ((art && art.decks) || [])) cards += (d.cards || []).length;
  }
  let lessons = 0, slides = 0;
  for (const e of realEntries().sessions) {
    const art = realArt(e);
    for (const u of ((art && art.units) || [])) { lessons += 1; slides += (u.slides || []).length; }
  }
  return { chapters: builtSections().length, total: SECTIONS.length, cards, items: Object.keys(byId).length, lessons, slides, modules: mods.length };
}
function realEmpty(what) {
  return `<h1>Utah Driver Handbook</h1>
  <div class="card"><h2>No accepted ${esc(what)} yet</h2>
  <p>The belt has no accepted artifact for this yet. Run <code>node tools/preview/export-content.mjs</code> after the belt accepts it, then re-open this page.</p></div>`;
}
// A section exists in the KG (so the module/unit is real) but the artifact
// behind this step is not accepted yet: honest pending state, never filler.
function realPending(sectionId, what) {
  return `<h1>${esc(shortSection(sectionId))}</h1>
  <div class="card"><h2>${esc(what)} — not yet built</h2>
  <p>The belt has not accepted this artifact for this chapter yet. Nothing synthetic is shown in its place.</p>
  <p><a class="btn" href="#/chapter/${esc(sectionId)}">Back to the chapter</a></p></div>`;
}
function sectionOfModule(moduleId) {
  const m = modulesReal().find((x) => x.module_id === moduleId);
  return m ? m.section_id : null;
}

function vHome() {
  const c = handbookCounts();
  if (!c.chapters) return realEmpty("knowledge graph");
  const built = builtSections();
  return `<h1>Utah Driver Handbook — written-test prep</h1>
  <p class="muted">${esc(REAL_NOTE)}. Written-test preparation for regular non-commercial passenger-car rules. Everything below is a belt-accepted artifact, shown word-for-word; full audit is still pending.</p>
  <div class="card"><h2>${c.chapters} of ${c.total} chapters built · ${c.cards} flashcards · ${c.items} quiz items · ${c.lessons} lessons (${c.slides} slides)</h2>
  <p class="muted">Counts come from the accepted exports — no synthetic filler anywhere on learner routes.</p>
  <p><a class="btn" href="#/chapters">Browse all ${c.total} chapters</a> <a class="btn" href="#/practice">Practice tests</a> <a href="trace.html">How it was made — belt trace</a></p></div>
  ${built.map((s) => {
    const mods = modulesReal(s.id);
    const cards = mods.reduce((n, m) => n + (m.unit_id ? deckForUnit(m.unit_id).length : 0), 0);
    return `<div class="card"><h2>Chapter ${s.n} — ${esc(s.title)}</h2>
    <p class="muted">${mods.length} modules · ${cards} flashcards</p>
    <p><a class="btn" href="#/chapter/${esc(s.id)}">Open chapter</a></p></div>`;
  }).join("")}`;
}

function vChapters() {
  const c = handbookCounts();
  if (!c.chapters) return realEmpty("knowledge graph");
  const has = new Set(builtSections().map((s) => s.id));
  return `<h1>Chapters — Utah Driver Handbook</h1>
  <p class="muted">${esc(REAL_NOTE)}. One chapter per handbook section, in handbook order. ${c.chapters} of ${c.total} built so far.</p>
  ${SECTIONS.map((s) => {
    const mods = has.has(s.id) ? modulesReal(s.id) : [];
    return `<div class="card"><h2>Chapter ${s.n} — ${esc(s.title)}</h2>
    ${has.has(s.id)
      ? `<p class="muted">${mods.length} modules from the accepted knowledge graph</p><p><a class="btn" href="#/chapter/${esc(s.id)}">Open chapter</a></p>`
      : `<p class="muted">Not yet built — the belt has no accepted artifacts for this chapter yet.</p>`}</div>`;
  }).join("")}`;
}

function vChapter(sectionId) {
  const meta = sectionMeta(sectionId);
  if (!meta) return vMissing();
  const mods = modulesReal(sectionId);
  if (!mods.length) {
    return `<h1>Chapter ${meta.n} — ${esc(meta.title)}</h1>
    <div class="card"><h2>Not yet built</h2>
    <p>The belt has no accepted artifacts for this chapter yet. Nothing synthetic is shown in its place.</p>
    <p><a class="btn" href="#/chapters">Back to all chapters</a></p></div>`;
  }
  return `<h1>Chapter ${meta.n} — ${esc(meta.title)}</h1>
  <p class="muted">${esc(REAL_NOTE)}. Study each module in order: lesson, then flashcards, then the quiz.</p>
  ${mods.map((m) => {
    const unit = m.unit_id ? sessionUnit(m.unit_id) : null;
    const deck = m.unit_id ? deckForUnit(m.unit_id) : [];
    const quiz = m.unit_id ? moduleQuizForUnit(m.unit_id) : null;
    const s = (m.unit_id && store.read().progress?.[m.unit_id]) || {};
    return `<div class="card"><h2>${esc(m.module_id)} — ${esc(m.title)}</h2>
    <p class="muted">${m.nodeCount} handbook nodes · ${(unit ? unit.slides : []).length || "no"} lesson slides · ${deck.length || "no"} flashcards · ${(quiz ? quiz.item_ids : []).length || "no"} quiz questions</p>
    <dl class="kv"><dt>Lesson</dt><dd>${unit ? (s.lesson ? "done" : "not started") : "not yet built"}</dd>
    <dt>Cards seen</dt><dd>${deck.length ? (s.cards ? "yes" : "no") : "not yet built"}</dd></dl>
    <p><a class="btn" href="#/module/${esc(m.module_id)}">Open module hub</a></p></div>`;
  }).join("")}
  <div class="card"><h2>Practice tests</h2>
  <p>Practice forms drawn from this chapter's accepted exam bank, if any. Practice only — no official pass claim.</p>
  <p><a class="btn" href="#/practice">Choose a practice form</a></p></div>`;
}

function sectionOfUnit(unitId) {
  const m = modulesReal().find((x) => x.unit_id === unitId);
  return m ? m.section_id : null;
}

function vModule(moduleId) {
  const m = modulesReal().find((x) => x.module_id === moduleId);
  if (!m || !m.unit_id) return vMissing();
  const unit = sessionUnit(m.unit_id);
  const deck = deckForUnit(m.unit_id);
  const quiz = moduleQuizForUnit(m.unit_id);
  const s = store.read().progress?.[m.unit_id] || {};
  return `<h1>Module hub — ${esc(m.title)}</h1>
  <p class="muted">${esc(REAL_NOTE)} · ${esc(shortSection(m.section_id))}. Study in order: lesson, then flashcards, then the quiz.</p>
  <div class="card"><h2>1 · Lesson</h2>
  ${unit
    ? `<p class="muted">${unit.slides.length} slides · ${s.lesson ? "done" : "not started"}</p><p><a class="btn" href="#/lesson/${esc(m.unit_id)}">Start the lesson</a></p>`
    : `<p class="muted">Not yet built — the belt has no accepted lesson for this module yet.</p>`}</div>
  <div class="card"><h2>2 · Flashcards</h2>
  ${deck.length
    ? `<p class="muted">${deck.length} cards · ${s.cards ? "seen" : "not started"}</p><p><a class="btn" href="#/cards/${esc(m.unit_id)}">Drill the cards</a></p>`
    : `<p class="muted">Not yet built — the belt has no accepted cards for this module yet.</p>`}</div>
  <div class="card"><h2>3 · Quiz</h2>
  ${quiz
    ? `<p class="muted">${quiz.item_ids.length} questions · ${esc(quiz.title || "")}</p><p><a class="btn" href="#/quiz/${esc(m.unit_id)}">Take the module quiz</a></p>`
    : `<p class="muted">Not yet built — the belt has no accepted quiz for this module yet.</p>`}</div>
  <p><a class="btn" href="#/chapter/${esc(m.section_id)}">Back to ${esc(shortSection(m.section_id))}</a></p>`;
}

function vLesson(unitId) {
  const unit = sessionUnit(unitId);
  if (!unit) {
    const sec = sectionOfUnit(unitId);
    return sec ? realPending(sec, "Lesson") : vMissing();
  }
  const moduleId = moduleForUnit(unitId);
  const wx = unit.worked_example || {}, mc = unit.misconception || {}, sc = unit.self_check || {};
  const mcClaim = mc.claim || {}, mcFix = mc.correction || {};
  return `<h1>Lesson: ${esc(unit.title && unit.title.text)}</h1>
  <p class="muted">${esc(REAL_NOTE)}.</p>
  ${(unit.slides || []).map((sl, i) => `<div class="card"><h2>Slide ${i + 1} of ${unit.slides.length} — ${esc(sl.title && sl.title.text)}</h2>
    ${((sl.lines) || []).map((l) => `<p>${esc(l.text)}</p>`).join("")}
    <div class="card"><h2>Teacher says (about ${esc(String(sl.estimated_narration_seconds))}s)</h2>
    <p>${esc(sl.narration && sl.narration.text)}</p></div>
    ${sourceLine([...new Set([...((sl.title && sl.title.fact_ids) || []), ...((sl.lines || []).flatMap((l) => l.fact_ids || [])), ...((sl.narration && sl.narration.fact_ids) || [])])])}</div>`).join("")}
  ${((unit.why_how) || []).map((w) => `<div class="card"><h2>Why and how</h2><p>${esc(w.text)}</p>${sourceLine(w.fact_ids)}</div>`).join("")}
  <div class="card"><h2>Worked example</h2>
    <p><b>Situation.</b> ${esc(wx.scenario && wx.scenario.text)}</p>
    <p><b>Reasoning.</b> ${esc(wx.reasoning && wx.reasoning.text)}</p>
    <p><b>Outcome.</b> ${esc(wx.result && wx.result.text)}</p></div>
  <div class="card"><h2>Common misconception</h2>
    <p><b>False:</b> ${esc(mcClaim.text)}</p><p><b>Truth:</b> ${esc(mcFix.text)}</p></div>
  <div class="card"><h2>Memory support</h2><p>${esc(unit.memory_support && unit.memory_support.text)}</p></div>
  <div class="card"><h2>Self-check</h2><p>${esc(sc.prompt && sc.prompt.text)}</p>
    <p><button data-reveal>Reveal answer</button></p>
    <p hidden data-answer><b>Answer.</b> ${esc(sc.answer && sc.answer.text)}<br><b>Why.</b> ${esc(sc.rationale && sc.rationale.text)}</p></div>
  <p><a class="btn" href="#/cards/${esc(unitId)}">Continue to flashcards</a>${moduleId ? ` <a class="btn" href="#/module/${esc(moduleId)}">Back to module hub</a>` : ""}</p>`;
}

function vCards(unitId) {
  const list = deckForUnit(unitId);
  if (!list.length) {
    const sec = sectionOfUnit(unitId);
    return sec ? realPending(sec, "Flashcards") : vMissing();
  }
  const moduleId = moduleForUnit(unitId);
  const byCard = scriptsByCard();
  const recap = moduleId ? recapForModule(moduleId) : null;
  return `<h1>Flashcards — recall, then reveal</h1>
  <p class="muted">${esc(REAL_NOTE)}. ${list.length} accepted cards, worded exactly as accepted.</p>
  ${list.map((c, i) => `<div class="card"><h2>Card ${i + 1} of ${list.length}</h2>
    <p>${esc(c.front)}</p>
    <p><button data-recall>Recall, then reveal</button></p>

function sUnitRefs() {
  const ch = D.manifest.chapters[0];

  const cards = D.cards.decks[0].cards.filter((c) => c.unit_id === u.unit_id);
  const unit = D.teaching.units.find((x) => x.unit_id === u.unit_id);

    "Module quiz with supported rationales. Missed questions are listed for review after you check.", null)

function vPractice(formId) {
  const forms = practiceForms();
  if (!forms.length) return realEmpty("exam bank");
  if (formId) {
    const f = forms.find((x) => x.form_id === formId);
    if (!f) return vMissing();
    return realQuizBlock(f.item_ids, "form:" + f.form_id, f.title,
      "Full practice form drawn from the accepted exam bank. Scores describe observed practice only — never licensing eligibility, driving competence, or predicted success.",

  const bySec = {};

  return `<h1>Practice tests — Utah Driver Handbook</h1>
  <p class="muted">${esc(REAL_NOTE)}. ${forms.length} accepted practice forms across ${Object.keys(bySec).length} chapter(s). Practice only — no official pass claim.</p>

}

      <p><button type="submit">Check answers</button></p>
      <div data-summary></div></form>`;
    return `<div class="card"><h2>Stage 06 exam bank: ${items.length} items · ${quizzes.length} module quiz(zes) · ${forms.length} practice form(s)</h2>
    <dl class="kv"><dt>Section</dt><dd>${esc(shortSection(e.section_id))}</dd>
    <dt>Provenance</dt><dd>task <code>${esc(e.task_id)}</code> · attempt <code>${esc(e.attempt_id)}</code><br>sha256 <code>${esc(e.sha256)}</code> · ${esc(e.bytes)} bytes</dd></dl></div>`
    + forms.map((f) => `<div class="card"><h2>${esc(f.title)} (practice form)</h2></div>` + block(f.item_ids || [], "real:form:" + f.form_id, f.title)).join("")
    + quizzes.map((q) => `<div class="card"><h2>${esc(q.title)} (module quiz)</h2></div>` + block(q.item_ids || [], "real:quiz:" + q.quiz_id, q.title)).join("");
  }).join("")}`;
}

function vRealLesson() {
  const { sessions } = realEntries();
  if (!sessions.length) {
    return `<h1>Real lesson — Utah Driver Handbook</h1>
    <div class="card"><h2>No accepted lesson yet</h2>
    <p>Stage 05.sessions has no ledger task with status <code>accepted</code>, so there is nothing real to show. Held or blocked attempts are never displayed here.</p>
    <p class="muted">Operator step after the belt accepts sessions: <code>node tools/preview/export-content.mjs</code>, then re-open this page.</p></div>`;
  }
  return `<h1>Real lesson — Utah Driver Handbook</h1>
  <p class="muted">${esc(REAL_NOTE)}. Accepted stage-05 teaching units with provenance. Full audit is still pending. Narration text is shown as written copy; no audio is generated in this preview.</p>
  ${sessions.map((e) => {
    const art = realArt(e);
    if (!art) return `<div class="card"><h2>${esc(e.stage_id)} — file missing</h2><p>Listed in the manifest but not loaded.</p></div>`;
    const units = Array.isArray(art.units) ? art.units : [];
    return `<div class="card"><h2>Stage 05 sessions: ${units.length} teaching unit(s)</h2>
    <dl class="kv"><dt>Section</dt><dd>${esc(shortSection(e.section_id))}</dd>
    <dt>Provenance</dt><dd>task <code>${esc(e.task_id)}</code> · attempt <code>${esc(e.attempt_id)}</code><br>sha256 <code>${esc(e.sha256)}</code> · ${esc(e.bytes)} bytes</dd></dl></div>`
    + units.map((u) => {
      const wx = u.worked_example || {}, mc = u.misconception || {}, sc = u.self_check || {};
      const mcClaim = mc.claim || {}, mcFix = mc.correction || {};
      return `<div class="card"><h2>Unit ${esc(u.unit_id)} (module ${esc(u.module_id)}) — ${esc(u.title && u.title.text)}</h2>
      <p class="muted">Objectives: ${((u.objective_ids) || []).map(esc).join(", ") || "(none declared)"}</p></div>`
      + ((u.why_how || []).map((w) => `<div class="card"><h2>Why this exists</h2><p>${esc(w.text)}</p><p class="muted">Facts: ${((w.fact_ids) || []).map(esc).join(", ")}</p></div>`).join(""))
      + ((u.slides || []).map((sl, i) => `<div class="card"><h2>Slide ${i + 1} — ${esc(sl.kind)}</h2>
        ${((sl.lines) || []).map((l) => `<p>${esc(l.text)}</p>`).join("")}
        <p><b>Narration (${esc(String(sl.estimated_narration_seconds))}s).</b> ${esc(sl.narration && sl.narration.text)}</p></div>`).join(""))
      + `<div class="card"><h2>Worked example</h2>
        <p><b>Situation.</b> ${esc(wx.scenario && wx.scenario.text)}</p>
        <p><b>Reasoning.</b> ${esc(wx.reasoning && wx.reasoning.text)}</p>
        <p><b>Outcome.</b> ${esc(wx.result && wx.result.text)}</p></div>
      <div class="card"><h2>Common misconception</h2>
        <p><b>False:</b> ${esc(mcClaim.text)}</p><p><b>Truth:</b> ${esc(mcFix.text)}</p></div>
      <div class="card"><h2>Memory support</h2><p>${esc(u.memory_support && u.memory_support.text)}</p></div>
      <div class="card"><h2>Self-check</h2><p>${esc(sc.prompt && sc.prompt.text)}</p>
        <p><button data-reveal>Reveal answer</button></p>
        <p hidden data-answer><b>Answer.</b> ${esc(sc.answer && sc.answer.text)}<br><b>Why.</b> ${esc(sc.rationale && sc.rationale.text)}</p></div>`;
    }).join("");
  }).join("")}
  <p><a class="btn" href="#/real-cards">Continue to the real flashcards</a></p>`;
}

function realGradeQuiz(form, formId, title) {
  const answers = [];
  form.querySelectorAll("[data-ritem]").forEach((box) => {
    const correct = box.dataset.correct;
    const why = box.dataset.why || "";
    const stem = box.dataset.stem || box.dataset.ritem;
    const pickedBtn = box.querySelector(".option[aria-pressed='true']");
    const picked = pickedBtn ? pickedBtn.dataset.key : null;
    const ok = picked === correct;
    const options = [];
    box.querySelectorAll(".option").forEach((b) => {
      options.push({ key: b.dataset.key, text: b.dataset.otext || b.textContent || "", rationale: b.dataset.orationale || "" });
    });
    answers.push({ itemId: box.dataset.ritem, picked, correct: ok, stem, why, key: correct, options });
    const fb = box.querySelector("[data-feedback]");
    fb.hidden = false;
    const optLines = options.map((o) => `<br>· <b>${esc(o.key)}.</b> ${esc(o.text)} — ${esc(o.rationale || "")}`).join("");
    fb.innerHTML = picked
      ? (ok ? `<p class="result-good">Correct.</p>` : `<p class="result-bad">Not quite — you chose ${esc(picked)}.</p>`) + `<p><b>Why ${esc(correct)}:</b> ${esc(why)}${optLines}</p>`
      : `<p class="result-bad">No answer chosen.</p><p><b>Correct answer ${esc(correct)}:</b> ${esc(why)}${optLines}</p>`;
    box.querySelectorAll(".option").forEach((b) => {
      b.disabled = true;
      if (b.dataset.key === correct) b.classList.add("picked-correct");
      else if (b.getAttribute("aria-pressed") === "true") b.classList.add("picked-wrong");
      else b.classList.add("dim");
    });
  });
  const correctCount = answers.filter((a) => a.correct).length;
  const attemptId = "attempt-" + Date.now().toString(36);
  saveResult({ attemptId, formId, title, answers, correctCount, takenAt: new Date().toISOString() });
  form.querySelector("[data-summary]").innerHTML =
    `<div class="card"><h2>You answered ${correctCount} of ${answers.length}</h2>
    <p class="muted">Observed practice only — never licensing eligibility or predicted success.</p>
    <p><a class="btn" href="#/results/${attemptId}">See results and next steps</a></p></div>`;
  form.querySelector("[data-summary]").scrollIntoView();
}

function synthGradeQuiz(form, formId, title) {
  const answers = [];
  form.querySelectorAll("[data-sitem]").forEach((box) => {
    const item = sItemById(box.dataset.sitem);
    const picked = box.querySelector(".option[aria-pressed='true']")?.dataset.key || null;
    const correct = picked === item.correct_key;
    answers.push({ itemId: item.item_id, picked, correct, stem: item.stem, why: item.correct_rationale, key: item.correct_key, options: item.options });
    const fb = box.querySelector("[data-feedback]");
    fb.hidden = false;
    fb.innerHTML = picked
      ? (correct ? `<p class="result-good">Correct.</p>` : `<p class="result-bad">Not quite — you chose ${esc(picked)}.</p>`) + `<p><b>Why ${esc(item.correct_key)}:</b> ${esc(item.correct_rationale)}</p>`
      : `<p class="result-bad">No answer chosen.</p><p><b>Correct answer ${esc(item.correct_key)}:</b> ${esc(item.correct_rationale)}</p>`;
    box.querySelectorAll(".option").forEach((b) => {
      b.disabled = true;
      if (b.dataset.key === item.correct_key) b.classList.add("picked-correct");
      else if (b.getAttribute("aria-pressed") === "true") b.classList.add("picked-wrong");
      else b.classList.add("dim");
    });
  });
  const correctCount = answers.filter((a) => a.correct).length;
  form.querySelector("[data-summary]").innerHTML =
    `<div class="card"><h2>You answered ${correctCount} of ${answers.length}</h2>
    <p class="muted">${esc(SYNTHETIC_NOTE)} Observed practice only.</p></div>`;
  form.querySelector("[data-summary]").scrollIntoView();
}

function wire() {
  view.querySelectorAll("[data-reveal]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const ans = btn.closest(".card").querySelector("[data-answer]");
      ans.hidden = !ans.hidden;
      btn.textContent = ans.hidden ? "Reveal answer" : "Hide answer";
    });
  });
  view.querySelectorAll("[data-recall]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const card = btn.closest(".card");
      const beat = card.querySelector("[data-beat]");
      const ans = card.querySelector("[data-answer]");
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        ans.hidden = false;
        btn.textContent = "Answer shown";
        return;
      }
      beat.hidden = false;
      let left = 3;
      beat.textContent = `Take about ${left} seconds to recall…`;
      const tick = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(tick);
          beat.hidden = true;
          ans.hidden = false;
          btn.textContent = "Answer shown";
        } else {
          beat.textContent = `Take about ${left} seconds to recall…`;
        }
      }, 1000);
    });
  });
  const h = location.hash || "#/";
  const lessonHit = h.startsWith("#/lesson/");
  const cardsHit = h.startsWith("#/cards/");
  if (lessonHit) markDone(h.split("/")[2], "lesson");
  if (cardsHit) markDone(h.split("/")[2], "cards");
  view.querySelectorAll(".option").forEach((b) => {
    b.addEventListener("click", () => {
      const scope = b.closest("[data-ritem]") || b.closest("[data-sitem]");
      if (scope) scope.querySelectorAll(".option").forEach((x) => x.removeAttribute("aria-pressed"));
      b.setAttribute("aria-pressed", "true");
    });
  });
  view.querySelectorAll("form[data-rquiz]").forEach((form) => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      realGradeQuiz(form, form.dataset.rquiz, document.querySelector("#view h1")?.textContent || "Quiz");
    });
  });
  view.querySelectorAll("form[data-squiz]").forEach((form) => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      synthGradeQuiz(form, form.dataset.squiz, document.querySelector("#view h1")?.textContent || "Synthetic practice");
    });
  });
  const reset = view.querySelector("#reset-progress");
  if (reset) reset.addEventListener("click", () => {
    localStorage.removeItem(store.key);
    view.querySelector("[data-reset-done]")?.remove();
    reset.insertAdjacentHTML("afterend", `<p data-reset-done class="result-good">Preview progress erased on this device.</p>`);
  });
}

function route() {
  const h = location.hash || "#/";
  const parts = h.replace(/^#\//, "").split("/");
  let html = "", nav = "home", banner = "real", bannerText = REAL_NOTE;
  if (parts[0] === "") html = vHome();
  else if (parts[0] === "chapters") { html = vChapters(); nav = "chapters"; }
  else if (parts[0] === "chapter") html = vChapter(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "module") html = vModule(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "lesson") html = vLesson(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "cards") html = vCards(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "quiz") html = vQuiz(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "practice" && parts[1]) { html = vPractice(decodeURIComponent(parts[1])); nav = "practice"; }
  else if (parts[0] === "practice") { html = vPractice(null); nav = "practice"; }
  else if (parts[0] === "results") html = vResults(decodeURIComponent(parts[1] || ""));
  else if (parts[0] === "settings") { html = vSettings(); nav = "settings"; }
  else if (parts[0] === "synthetic-sample") { html = vSyntheticSample(); banner = "synthetic"; bannerText = SYNTHETIC_NOTE; }
  else if (parts[0] === "dossier") { html = vDossier(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (parts[0] === "modules") { html = vModules(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (parts[0] === "real-cards") { html = vRealCards(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (parts[0] === "real-quiz") { html = vRealQuiz(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else if (parts[0] === "real-lesson") { html = vRealLesson(); banner = "review"; bannerText = REVIEWER_EMPTY_NOTE; }
  else html = vMissing();
  if (banner === "review") {
    const re = realEntries();
    const n = parts[0] === "dossier" ? re.dossier.length + re.kg.length + re.cards.length + re.exam.length + re.sessions.length + re.scripts.length + re.other.length : parts[0] === "modules" ? re.kg.length : parts[0] === "real-quiz" ? re.exam.length : parts[0] === "real-lesson" ? re.sessions.length : re.cards.length + re.scripts.length;
    if (n) { banner = "real"; bannerText = REAL_NOTE; }
  }
  setBanner(banner, bannerText);
  view.innerHTML = html;
  document.querySelectorAll("nav.main a").forEach((a) => {
    if (a.dataset.nav === nav) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  wire();
  view.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
loadReal().then((r) => { R = r; _factPages = null; return loadData(); }).then((d) => { D = d; route(); }).catch(() => {});
</script>
